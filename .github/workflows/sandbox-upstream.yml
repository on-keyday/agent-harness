name: Sandbox upstream compatibility

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Upstream agent to check (all includes the image's bash)
        type: choice
        default: all
        options: [all, claude, codex, agy, opencode, pi, bash]
  pull_request:
    paths:
      - scripts/sandbox/**
      - scripts/agent_presets.py
      - .github/workflows/sandbox-upstream.yml
  push:
    branches: [main]
    paths:
      - scripts/sandbox/**
      - scripts/agent_presets.py
      - .github/workflows/sandbox-upstream.yml

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build the production sandbox image
        run: scripts/sandbox/build.sh
      - name: Test upstream candidates without credentials or inference
        env:
          AGENT: ${{ inputs.agent || 'all' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sandbox/check_agent_releases.py --agent "$AGENT" --smoke | tee upstream-report.json
      - name: Keep the release/compatibility report even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-upstream-report
          path: upstream-report.json
          if-no-files-found: warn
          retention-days: 30
